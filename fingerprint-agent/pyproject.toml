[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerprint-agent"
version = "0.2.0"
description = "Local HTTP service that wraps the DigitalPersona 4500 reader on each admin PC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.0",
    "structlog==24.4.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
# Hardware stack — only needed on the actual admin PC, not on CI.
hardware = [
    "dbus-python==1.3.2",
    "PyGObject==3.50.0",
]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
